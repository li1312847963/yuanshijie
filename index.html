<title>APE 主网部署控制台 v3（加固版）</title>

<body style="margin:0;padding:0;background:#F4F3EE;">
<div style="box-sizing:border-box;font-family:'PingFang SC','Roboto',Arial,sans-serif;max-width:760px;margin:0 auto;padding:16px;">
  <h3 style="margin:0 0 4px;color:#1A1B1C;font-size:18px;">APE 主网部署控制台 v3（加固版）</h3>
  <p style="margin:0 0 12px;color:#EA6668;font-size:13px;line-height:1.5;">⚠️ 仅 Chain ID 56（BNB Smart Chain 主网）可用。部署=真实合约+真实 gas；fund 前确保 3 亿 APE 在连接的钱包里。</p>

  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">
    <button id="connectBtn" style="flex:0 0 auto;padding:12px 18px;border:0;border-radius:12px;background:#1A1B1C;color:#fff;font-size:14px;font-weight:600;cursor:pointer;">① 连接钱包</button>
    <div style="flex:1 1 200px;min-width:0;font-size:12px;color:#6B7280;line-height:1.5;">
      <div id="accInfo">未连接</div>
      <div id="netInfo" style="margin-top:2px;"></div>
    </div>
  </div>

  <div id="btnArea" style="display:none;flex-direction:column;gap:10px;">

    <div style="background:#fff;border:1px solid #E4E3DD;border-radius:12px;padding:12px;">
      <div style="font-size:13px;font-weight:600;color:#1A1B1C;margin-bottom:8px;">第一步 · 部署（顺序：Vault → 池A → 池B）</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <input id="apeIn" type="text" value="0x0EF60d664456caDedbf3AFCe6F5773eC968EfB9E" style="flex:2 1 300px;min-width:0;padding:10px;border:1px solid #E4E3DD;border-radius:10px;font-size:12px;box-sizing:border-box;" placeholder="APE 合约地址">
        <input id="vaultIn" type="text" value="" style="flex:2 1 300px;min-width:0;padding:10px;border:1px solid #E4E3DD;border-radius:10px;font-size:12px;box-sizing:border-box;" placeholder="RewardsVault 地址（部署后自动填）">
        <input id="safeIn" type="text" value="0xE7F74bD4Fa93dC294764E417dC618D713E49efE0" style="flex:2 1 300px;min-width:0;padding:10px;border:1px solid #E4E3DD;border-radius:10px;font-size:12px;box-sizing:border-box;" placeholder="Safe 多签地址">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="act" data-act="deployVault" style="flex:1 1 180px;padding:12px 12px;border:0;border-radius:12px;background:#1A1B1C;color:#fff;font-size:13px;cursor:pointer;">② 部署 RewardsVault</button>
        <button class="act" data-act="deployPoolA" style="flex:1 1 180px;padding:12px 12px;border:0;border-radius:12px;background:#1A1B1C;color:#fff;font-size:13px;cursor:pointer;">③ 部署 Pool A（LP 池）</button>
        <button class="act" data-act="deployPoolB" style="flex:1 1 180px;padding:12px 12px;border:0;border-radius:12px;background:#1A1B1C;color:#fff;font-size:13px;cursor:pointer;">④ 部署 Pool B（单币池）</button>
      </div>
      <div style="font-size:11px;color:#6B7280;margin-top:8px;line-height:1.6;">
        Pool A = APE/WBNB LP（0x631c1ff692b43ac0096ef09e532a31dc08f3324c）质押；Pool B = APE 单币质押。<br>
        已部署记录：Vault <span id="recVault" style="font-family:monospace;">（无）</span>｜Pool A <span id="recPoolA" style="font-family:monospace;">（无）</span>｜Pool B <span id="recPoolB" style="font-family:monospace;">（无）</span>
      </div>
    </div>

    <div style="background:#fff;border:1px solid #E4E3DD;border-radius:12px;padding:12px;">
      <div style="font-size:13px;font-weight:600;color:#1A1B1C;margin-bottom:8px;">第二步 · 配置 + 转入（顺序不可乱）</div>
      <button class="act" data-act="cfgA" style="width:100%;padding:12px 16px;border:0;border-radius:12px;background:#8BC8EA;color:#1A1B1C;font-size:14px;cursor:pointer;text-align:left;">⑤ 配置 Pool A 权重 = 7000</button>
      <button class="act" data-act="cfgB" style="width:100%;margin-top:8px;padding:12px 16px;border:0;border-radius:12px;background:#8BC8EA;color:#1A1B1C;font-size:14px;cursor:pointer;text-align:left;">⑥ 配置 Pool B 权重 = 3000</button>
      <button class="act" data-act="approve" style="width:100%;margin-top:8px;padding:12px 16px;border:0;border-radius:12px;background:#1A1B1C;color:#fff;font-size:14px;cursor:pointer;text-align:left;">⑦ 授权 APE → Vault：3 亿（<b>需持有 3 亿 APE 的钱包连接</b>）</button>
      <button class="act" data-act="fund" style="width:100%;margin-top:8px;padding:12px 16px;border:0;border-radius:12px;background:#52C41A;color:#fff;font-size:14px;cursor:pointer;text-align:left;">⑧ 转入 fund：3 亿 APE（<b>同上，一次性</b>）</button>
      <button class="act" data-act="verify" style="width:100%;margin-top:8px;padding:12px 16px;border:0;border-radius:12px;background:#E4E3DD;color:#1A1B1C;font-size:14px;cursor:pointer;text-align:left;">⑨ 验证：释放速率 + Vault 余额 + 权重</button>
      <button class="act" data-act="transfer" style="width:100%;margin-top:8px;padding:12px 16px;border:0;border-radius:12px;background:#EA6668;color:#fff;font-size:14px;cursor:pointer;text-align:left;">⑩ 移交 owner → Safe（transferOwnership，2/3 签名后生效）</button>
      <button class="act" data-act="bal" style="width:100%;margin-top:8px;padding:12px 16px;border:0;border-radius:12px;background:#E4E3DD;color:#1A1B1C;font-size:14px;cursor:pointer;text-align:left;">⑪ 我的钱包 APE 余额（确认持有量）</button>
      <button class="act" data-act="taxoff" style="width:100%;margin-top:8px;padding:12px 16px;border:0;border-radius:12px;background:#EA6668;color:#fff;font-size:14px;cursor:pointer;text-align:left;">⑫ 关闭 APE 转账税（setTaxFee=0，仅 owner，fund 前执行）</button>
      <button class="act" data-act="emergReq" style="width:100%;margin-top:8px;padding:12px 16px;border:0;border-radius:12px;background:#FAAD14;color:#1A1B1C;font-size:14px;cursor:pointer;text-align:left;">⑬ 旧 Vault 请求紧急提款（7 天后可提，仅 owner）</button>
      <input id="withdrawAmount" type="text" placeholder="提款数量（APE 个数，例如 299997230）" style="width:100%;margin-top:8px;padding:12px 16px;border:1px solid #E4E3DD;border-radius:12px;font-size:14px;box-sizing:border-box;">
      <button class="act" data-act="emergExec" style="width:100%;margin-top:8px;padding:12px 16px;border:0;border-radius:12px;background:#FAAD14;color:#1A1B1C;font-size:14px;cursor:pointer;text-align:left;">⑭ 旧 Vault 执行紧急提款（按上面输入框的数量提）</button>
    </div>

  </div>

            log("👉 下一步：登录 Safe（app.safe.global），发起交易调用 Vault 的 acceptOwnership()，2/3 签名后完成移交");
          } else if (act === "bal") {
            var m2 = new ethers.Contract(APE, ["function balanceOf(address) view returns (uint256)"], signer);
            var myAddr = await signer.getAddress();
            var myBal = await m2.balanceOf(myAddr);
            log("我的钱包 APE 余额 = " + ethers.utils.formatUnits(myBal, 18) + " APE");
            ok("余额查询完成");
          } else if (act === "taxoff") {
            var t6 = new ethers.Contract(APE, ["function setTaxFee(uint256)"], signer);
            await send(t6.setTaxFee(0), "关闭转账税 setTaxFee(0)");
            var tfC = new ethers.Contract(APE, ["function taxFee() view returns (uint256)"], signer);
            var tf = await tfC.taxFee();
            log("APE 当前税率 taxFee = " + tf.toString() + "（应为 0 = 已关闭）");
            ok("税率查询完成");
          } else if (act === "emergReq") {
            var v7 = addrOf(vaultIn.value);
            var myAddr2 = await signer.getAddress();
            var cv7 = new ethers.Contract(v7, ["function requestEmergencyWithdraw(address recipient)"], signer);
            await send(cv7.requestEmergencyWithdraw(myAddr2), "请求紧急提款（7 天延迟开始，接收=" + myAddr2 + "）");
            var tsC = new ethers.Contract(v7, ["function withdrawRequestTime() view returns (uint256)"], signer);
            var ts = (await tsC.withdrawRequestTime()).toNumber();
            log("👉 提款请求时间戳 = " + ts + "，约 7 天后（" + new Date((ts + 7 * 86400) * 1000).toLocaleString() + "）再点 ⑭ 执行");
          } else if (act === "emergExec") {
            var v8 = addrOf(vaultIn.value);
            var amtInput = document.getElementById("withdrawAmount").value.trim();
            if (!amtInput || isNaN(amtInput)) throw new Error("请在上面的输入框里填提款数量");
            var withdrawAmt = ethers.utils.parseUnits(amtInput, 18);
            var cv8 = new ethers.Contract(v8, ["function emergencyWithdraw(uint256 amount)"], signer);
            await send(cv8.emergencyWithdraw(withdrawAmt), "执行紧急提款（" + amtInput + " APE 回钱包）");
            ok("紧急提款完成，" + amtInput + " APE 已回钱包");
          }
        } catch (e) {
          err(act + " 失败：" + (e && e.message ? e.message : e));
        } finally {
          btn.disabled = false; btn.style.opacity = "1";
        }
      });
    });

    // 恢复已保存地址
    var sv = load("vault"); if (sv) { vaultIn.value = sv; recVault.textContent = sv; }
    var sa = load("poolA"); if (sa) recPoolA.textContent = sa;
    var sb = load("poolB"); if (sb) recPoolB.textContent = sb;
  })();
  </script>
</div>
</body>
</html>
